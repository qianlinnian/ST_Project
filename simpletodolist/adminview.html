<!doctype html>
<html>
<head><title>Todo Admin View</title>
    <link rel="stylesheet" type="text/css" href="css/todo.css">
    <script src="js/store.js"></script>
    <script src="js/api.js"></script>
    <script src="js/listmanagementtemplate.js"></script>
    <script src="js/listmanagementview.js"></script>
    <script src="js/todoapp.js"></script>
    <script src="js/admin.js"></script>
</head>
<body>


<section class="todoapp">
    <header class="header">
        <header class="header">
            <nav>[<a id="navtodolists" href="todolists.html">lists</a>]
                [<a id="navadminlogin" href="adminlogin.html">Admin Login</a>]
                    [<a id="navadminlogout" onclick="new Admin().logout();" href="">Logout</a>]
            </nav>

            <h1>Admin View</h1>
    </header>
    <section class="main" style="display: block;">
        <ul class="todo-list-list" id="reportlist">
        </ul>
    </section>
</section>

<script>

    if(!(new Admin().isLoggedIn())){
        window.location.href = "adminlogin.html";
    }


    function loginas(){

        var username = document.getElementsByName("username")[0].value;
        var password = document.getElementsByName("password")[0].value;
        var remember = document.getElementsByName("remember")[0].value;

        admin = new Admin();
        admin.login(username, password, remember, function(){
            document.getElementsByClassName("loginmessage")[0].innerHTML = "Login Details Incorrect";
        });

        return false;
    }

    new Admin().activateLoginLink();

    function displayListName(name){
        if(name.startsWith("todos-")){
            return name.substring("todos-".length);
        }
        return name;
    }

    function renderAdminList(todoList){
        var visibleName = displayListName(todoList.name);
        var li = document.createElement("li");
        var link = document.createElement("a");
        var stats = document.createElement("span");

        link.id = visibleName;
        link.href = "todo.html#/&" + encodeURIComponent(visibleName);
        link.textContent = visibleName;
        stats.textContent = " active: " + todoList.active
            + " completed: " + todoList.completed
            + " all: " + todoList.total;

        li.appendChild(link);
        li.appendChild(stats);
        document.getElementById("reportlist").appendChild(li);
    }

    function loadAdminReport(){
        var reportList = document.getElementById("reportlist");
        reportList.innerHTML = "";

        try {
            new ApiStorage().request("GET", "/lists").forEach(renderAdminList);
        } catch (error) {
            var li = document.createElement("li");
            li.textContent = "Could not load todo lists from API: " + error.message;
            reportList.appendChild(li);
        }
    }

    loadAdminReport();



</script>

</body>
</html>
